---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: suzuki-shunsuke/go-autofix-action@2c7f494d0149fe60c0adc9feb09b6b995bae00ec # v0.2.0
        with:
          aqua_version: v2.64.0
      - run: cat docs/HEADER.md docs/LIST.md docs/FOOTER.md > README.md
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
