---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: suzuki-shunsuke/go-autofix-action@ad61a60b1ab7061f3adca50247830727f0aa4df2 # v0.2.2
        with:
          aqua_version: v2.65.2
      - run: cat docs/HEADER.md docs/LIST.md docs/FOOTER.md > README.md
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
